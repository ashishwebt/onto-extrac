[package]
name = "onto_extra"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
baml = "0.221.0"
dotenvy = "0.15"
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
utoipa = { version = "5.5.0", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
